# Theme
theme                    : minimal-mistakes-jekyll
minimal_mistakes_skin    : "dusk" # custom, see _sass/minimal-mistakes/skins/_dusk.scss. Built-ins: "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site settings
locale                   : "en-US"
title                    : "Omara"
title_separator          : "-"
subtitle                 : # tagline shown below the title
name                     : "Omara"
description              : "Notes, projects and ideas from Omara."
url                      : "https://omara-org.github.io"
baseurl                  : ""
repository               : "Omara-org/omara-org.github.io"
search                   : true

# Site author
author:
  name   : "Omara"
  avatar : # e.g. "/assets/images/bio-photo.jpg"
  bio    : "Notes, projects and ideas."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Omara-org"

# Site footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Omara-org"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Europe/Rome

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

defaults:
  # posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
