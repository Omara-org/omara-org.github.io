# Theme
theme                    : minimal-mistakes-jekyll
minimal_mistakes_skin    : "dusk" # custom, see _sass/minimal-mistakes/skins/_dusk.scss. Built-ins: "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site settings
locale                   : "en-US"
title                    : "Omara"
title_separator          : "-"
subtitle                 : # tagline shown below the title
name                     : "Omara"
description              : "Open infrastructure for mobile core networks, built as composition: an engine, protocol libraries and thin network functions."
url                      : "https://algebrato.it" # TODO: change to your OVH domain, e.g. "https://example.com"
baseurl                  : ""
repository               : "Omara-org/omara-org.github.io"
search                   : true
logo                     : "/assets/images/logo.svg"

# Site author
author:
  name   : "Omara"
  avatar : # e.g. "/assets/images/bio-photo.jpg"
  bio    : "Own your core."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Omara-org"

# Site footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Omara-org"

# Build settings
markdown: kramdown
highlighter: rouge
timezone: Europe/Rome

collections:
  projects:
    output: true
    permalink: /:collection/:path/
  practices:
    output: true
    permalink: /:collection/:path/

include:
  - _pages
  - .htaccess
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

defaults:
  # pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  # projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "projects"
      toc: true
      toc_sticky: true
      toc_label: "On this page"
  # practices
  - scope:
      path: ""
      type: practices
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "practices"
      toc: true
      toc_sticky: true
