# Site settings
title: Omara
tagline: Notes, projects and ideas
description: >-
  The Omara blog: notes on what we build, what we learn and what we are thinking about.
url: "https://omara-org.github.io"
baseurl: ""
lang: en
timezone: Europe/Rome

author:
  name: Omara
github_username: Omara-org

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

permalink: /:year/:month/:title/
excerpt_separator: "<!--more-->"

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  posts_limit: 20

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
