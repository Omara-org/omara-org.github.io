# Build the Jekyll site and upload the generated _site/ folder to OVH web
# hosting over SFTP.  OVH shared hosting has no Ruby, so the build happens here.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   OVH_FTP_HOST      e.g. ftp.cluster0XX.hosting.ovh.net  (OVH panel: Hosting -> "FTP - SSH")
#   OVH_FTP_USER      the FTP/SFTP login shown in the same panel
#   OVH_FTP_PASSWORD  the password you set for that login
#
# OVH's FTP server does not accept explicit FTPS ("500 This security scheme is
# not implemented"), so the upload uses SFTP on port 22 with the same login.

name: Deploy to OVH

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "ovh-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload to OVH over SFTP
        env:
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          SSHPASS: ${{ secrets.OVH_FTP_PASSWORD }}
          # The folder your domain is attached to in OVH "Multisite"; "www" is the default.
          REMOTE_DIR: www
        run: |
          # Batch for the stock OpenSSH sftp client: enter the site folder on the
          # server, enter the build folder locally, upload everything.  The
          # second put covers .htaccess, which the * glob does not match.
          cat > sftp.batch <<EOF
          cd $REMOTE_DIR
          -rm index.html
          -rm .htaccess
          lcd _site
          put -r *
          put .htaccess
          bye
          EOF
          # Secrets pasted into GitHub sometimes carry a trailing line break; strip it.
          SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"; export SSHPASS
          OVH_FTP_USER="$(printf '%s' "$OVH_FTP_USER" | tr -d '[:space:]')"
          OVH_FTP_HOST="$(printf '%s' "$OVH_FTP_HOST" | tr -d '[:space:]')"
          # -b switches ssh to BatchMode, which disables password prompts, so
          # BatchMode=no must come first on the command line to win.
          sshpass -e sftp -P 22 -o BatchMode=no -o StrictHostKeyChecking=no -b sftp.batch "$OVH_FTP_USER@$OVH_FTP_HOST"
