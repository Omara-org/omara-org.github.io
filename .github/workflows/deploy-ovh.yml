# Build the Jekyll site and upload the generated _site/ folder to OVH web
# hosting over SFTP.  OVH shared hosting has no Ruby, so the build happens here.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   OVH_FTP_HOST      e.g. ftp.cluster0XX.hosting.ovh.net  (OVH panel: Hosting -> "FTP - SSH")
#   OVH_FTP_USER      the FTP/SFTP login shown in the same panel
#   OVH_FTP_PASSWORD  the password you set for that login
#
# OVH's FTP server does not accept explicit FTPS ("500 This security scheme is
# not implemented"), so the upload uses SFTP on port 22 with the same login.

name: Deploy to OVH

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "ovh-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to OVH over SFTP
        env:
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          # The folder your domain is attached to in OVH "Multisite"; "www" is the default.
          REMOTE_DIR: www
        run: |
          lftp -u "$OVH_FTP_USER","$OVH_FTP_PASSWORD" "sftp://$OVH_FTP_HOST:22" <<LFTP
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:timeout 30
            # --delete removes files on the server that no longer exist in _site/,
            # so the remote folder is an exact copy of the build.
            mirror --reverse --delete --verbose --parallel=4 _site/ "$REMOTE_DIR"/
            quit
          LFTP
