<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Omara logo">
  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#3f5c6b"/>
  <!-- signal arcs -->
  <g fill="none" stroke="#e8e2d6" stroke-width="3" stroke-linecap="round">
    <path d="M20 24a17 17 0 0 1 24 0"/>
    <path d="M25.5 29.5a9.5 9.5 0 0 1 13 0"/>
  </g>
  <!-- antenna head -->
  <circle cx="32" cy="35" r="3.2" fill="#e8e2d6"/>
  <!-- mast -->
  <path d="M32 38v12" stroke="#e8e2d6" stroke-width="3" stroke-linecap="round"/>
  <!-- core nodes (N3 / UPF / N6) -->
  <g fill="none" stroke="#e8e2d6" stroke-width="2.4" stroke-linecap="round">
    <path d="M20 50h24"/>
  </g>
  <g fill="#e8e2d6">
    <circle cx="19" cy="50" r="3"/>
    <circle cx="45" cy="50" r="3"/>
  </g>
  <circle cx="32" cy="50" r="3.4" fill="#3f5c6b" stroke="#e8e2d6" stroke-width="2.4"/>
</svg>
